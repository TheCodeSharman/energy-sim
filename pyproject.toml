[project]
name = "energy-sim"
version = "0.1.0"
description = "Home energy-cost simulator: prices real grid flows against the Aurora tariff and validates against the bill."
requires-python = ">=3.11"        # tomllib is stdlib from 3.11
dependencies = []                  # runtime is pure stdlib

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
