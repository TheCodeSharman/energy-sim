# Aurora Tariff 93 (Tasmania) — machine-readable source of truth for the simulator.
#
# These constants previously existed ONLY in prose (HomeAssistantConfig docs/CHANGELOG)
# and as un-versioned `tariff:*` series inside VictoriaMetrics. This file is the sim's
# authoritative copy. FY boundary is 2026-07-01 AEST.
#
# Rates are c/kWh; supply is c/day. `export_c_kwh` is the feed-in tariff (FiT).
#
# Money values are QUOTED so they arrive as text and go straight to Decimal. Unquoted, TOML
# parses them as floats, and 35.4782 becomes 35.478200000000001... — text to float and back
# again to reach a value we already had exactly. Keep the quotes when editing.
#
# Three FY2025-26 numbers are RECOVERED from Aurora's own billed data rather than taken from
# the source docs, because the doc values did not reproduce the bill. Recovery method: divide
# Aurora's billed dollars for a leg by Aurora's own metered kWh for that leg, per day, across
# June 2026 — each came out identical on all 30 days, so they are exact billed rates, not fits.
#
#   supply_c_day  — missing from the docs ("—"); billed "Other" is a stable $1.511814/day.
#   peak_c_kwh    — docs said 31.948, billed is 35.4782.
#   offpeak_c_kwh — docs said 14.876, billed is 16.6862.
#
# The doc values are believed to be ex-GST or stale: they imply a 13.3%/14.4% jump into
# FY2026-27, and a different jump per leg. The recovered values imply exactly +2.0000% on both
# legs (35.4782 x 1.02 = 36.187764 ~ 36.1878; 16.6862 x 1.02 = 17.019924 ~ 17.02), which is
# what a single annual price rise looks like. export_c_kwh needed no correction — the doc value
# 8.782 reproduces the billed FiT exactly.

# FY2023-24 and FY2024-25 are RECOVERED the same way (median of daily billed $ / metered kWh).
# The method reproduces FY2025-26 and FY2026-27 exactly from data, which is what validates it.
[[period]]                 # FY2023-24 — recovered from billed data
valid_from    = "2023-07-01"
peak_c_kwh    = "36.1980"
offpeak_c_kwh = "16.8550"
export_c_kwh  = "10.8690"
supply_c_day  = "126.3890"

[[period]]                 # FY2024-25 — recovered from billed data
valid_from    = "2024-07-01"
peak_c_kwh    = "35.8366"
offpeak_c_kwh = "16.6862"
export_c_kwh  = "8.9350"
supply_c_day  = "134.9834"

[[period]]                 # FY2025-26
valid_from    = "2025-07-01"
peak_c_kwh    = "35.4782"    # recovered from billed $ / metered kWh (docs said 31.948)
offpeak_c_kwh = "16.6862"    # recovered from billed $ / metered kWh (docs said 14.876)
export_c_kwh  = "8.782"
supply_c_day  = "151.1814"   # recovered from Aurora's billed daily "Other"; see docs/tariffs.md

[[period]]                 # FY2026-27
valid_from    = "2026-07-01"
peak_c_kwh    = "36.1878"
offpeak_c_kwh = "17.02"
export_c_kwh  = "9.276"
supply_c_day  = "172.3469"

# Aurora uses TWO clocks, and they are not the same one.
#
# [billing] — the fixed daily supply charge is billed per LOCAL calendar day, DST included.
# Aurora's daily records are stamped at local midnight: 13:00Z during AEDT, 14:00Z during AEST.
[billing]
timezone = "Australia/Hobart"

# [peak_window] — the time-of-use window is priced on FIXED AEST (UTC+10) all year. It does NOT
# follow daylight saving. Verified against Aurora's own billed split: in January 2026 its peak
# kWh land on local (AEDT) hours 8-10 and 17-21, which is exactly 7-9 and 16-20 in fixed AEST.
# Treating the window as DST-aware misprices ~10% of every summer month's hours; it is invisible
# in winter, when AEST and local time coincide.
#
# Equivalently, the window occupies UTC hours {6,7,8,9,10,21,22,23} year-round — the hour set
# powerflow.yml always had. Its bug was only that the Mon-Fri test used the UTC date rather than
# the UTC+10 date, so the 21:00-24:00Z block landed on the wrong day.
[peak_window]
timezone = "Etc/GMT-10"   # POSIX sign convention: Etc/GMT-10 IS UTC+10, and never shifts
# ISO weekday convention (Mon=1..Sun=7), so 1-5 = Mon-Fri.
local_weekdays = [1, 2, 3, 4, 5]
local_hours    = [7, 8, 9, 16, 17, 18, 19, 20]
